name: Apply cancellation display and recurring edit default
on:
  push:
    branches: [main]
    paths: ['.trigger-cancel-edit-fix']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live scheduler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          old="""function materializeSeriesOccurrence(parent, originalDate){
  const ex=exceptionFor(parent.id,originalDate);
  if(ex?.exception_status==='cancelled') return null;
  return {
    ...parent,
    id:parent.id+'__'+originalDate,
    parent_event_id:parent.id,
    original_event_date:originalDate,
    recurring_instance:true,
    recurrence_exception_id:ex?.id||null,
    date:ex?.new_event_date||originalDate,
    start_time:(ex?.new_start_time||parent.start_time||'00:00').slice(0,5),
    end_time:(ex?.new_end_time||parent.end_time||'23:59').slice(0,5),
    title:ex?.new_title ?? parent.title,
    notes:ex?.new_notes ?? parent.notes,
    // A cancellation/no-show belongs to the historical source occurrence, not every future repeat.
    // Recurring exceptions handle later occurrence cancellations individually.
    status: originalDate===parent.date ? parent.status : 'scheduled'
  };
}"""
          new="""const DELETED_OCCURRENCE_SENTINEL='__TOD_DONNA_DELETE_OCCURRENCE__';
function materializeSeriesOccurrence(parent, originalDate){
  const ex=exceptionFor(parent.id,originalDate);
  if(ex?.exception_status==='cancelled' && ex?.new_notes===DELETED_OCCURRENCE_SENTINEL) return null;
  return {
    ...parent,
    id:parent.id+'__'+originalDate,
    parent_event_id:parent.id,
    original_event_date:originalDate,
    recurring_instance:true,
    recurrence_exception_id:ex?.id||null,
    date:ex?.new_event_date||originalDate,
    start_time:(ex?.new_start_time||parent.start_time||'00:00').slice(0,5),
    end_time:(ex?.new_end_time||parent.end_time||'23:59').slice(0,5),
    title:ex?.new_title ?? parent.title,
    notes:ex?.new_notes===DELETED_OCCURRENCE_SENTINEL ? parent.notes : (ex?.new_notes ?? parent.notes),
    // Cancelling keeps the occurrence visible. Delete uses an explicit tombstone instead.
    status: ex?.exception_status==='cancelled' ? 'cancelled' : (originalDate===parent.date ? parent.status : 'scheduled')
  };
}"""
          if old not in s: raise SystemExit('materialize block not found')
          s=s.replace(old,new)

          old="""  if(scope==='occurrence'){
    await saveException({parent_event_id:parent.id,original_event_date:original,exception_status:'cancelled'});
  }else if(scope==='future'){"""
          new="""  if(scope==='occurrence'){
    await saveException({parent_event_id:parent.id,original_event_date:original,exception_status:'cancelled',new_notes:DELETED_OCCURRENCE_SENTINEL});
  }else if(scope==='future'){"""
          if old not in s: raise SystemExit('delete occurrence block not found')
          s=s.replace(old,new)

          start=s.index('function handleEditDetails(){')
          end=s.index('\n\n\n\nasync function loadStudentList()', start)
          block=s[start:end]
          old_part="""function handleEditDetails(){
  const e=state.detailsEvent;
  if(!e) return;
  if(!isSeriesOccurrence(e)){
    $('eventDetailsDialog').close(); openDialog(e); return;
  }
  const scope=chooseSeriesScope('Edit');
  if(!scope) return;
  const parent=parentEventFor(e);
  if(!parent){ alert('The recurring series could not be found.'); return; }
  const original=e.original_event_date || e.date;
  $('eventDetailsDialog').close();
  if(scope==='occurrence'){
    openDialog(e,{type:'occurrence',parentId:parent.id,originalDate:original});
  }else if(scope==='future'){
    if(original<=parent.date) openDialog(parent,{type:'series'});
    else openDialog({...e,id:parent.id,recurrence_rule:parent.recurrence_rule},{type:'future',parentId:parent.id,originalDate:original});
  }else{
    openDialog(parent,{type:'series'});
  }
}"""
          new_part="""function handleEditDetails(){
  const e=state.detailsEvent;
  if(!e) return;
  if(!isSeriesOccurrence(e)){
    $('eventDetailsDialog').close(); openDialog(e); return;
  }
  const parent=parentEventFor(e);
  if(!parent){ alert('The recurring series could not be found.'); return; }
  const original=e.original_event_date || e.date;
  $('eventDetailsDialog').close();
  openDialog(e,{type:'occurrence',parentId:parent.id,originalDate:original});
}"""
          if old_part not in s: raise SystemExit('edit handler block not found')
          s=s.replace(old_part,new_part)
          p.write_text(s)

          p=Path('styles.css')
          s=p.read_text()
          old='.cancelled { opacity:.45; }'
          new='.cancelled { opacity:.58; }\n.cancelled .event-title { text-decoration:line-through; text-decoration-thickness:1.5px; }'
          if old not in s: raise SystemExit('cancelled css not found')
          p.write_text(s.replace(old,new))

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('V1.34 · shared weekly planner','V1.35 · shared weekly planner')
          s=s.replace('styles.css?v=1.32','styles.css?v=1.35')
          s=s.replace('app.js?v=1.34','app.js?v=1.35')
          p.write_text(s)
          PY
          node --check app.js
          grep -q 'V1.35' index.html
          grep -q 'DELETED_OCCURRENCE_SENTINEL' app.js
          grep -q 'cancelled .event-title' styles.css
      - name: Commit and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-cancel-edit-fix.yml .trigger-cancel-edit-fix
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html .github/workflows/apply-cancel-edit-fix.yml .trigger-cancel-edit-fix
          git commit -m 'Fix cancellation display and recurring edit default'
          git push

name: Fix recurring status inheritance
on:
  push:
    branches: [main]
    paths: ['.github/trigger-recurring-status-fix']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix future recurring status and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text()
          old = """    title:ex?.new_title ?? parent.title,\n    notes:ex?.new_notes ?? parent.notes\n"""
          new = """    title:ex?.new_title ?? parent.title,\n    notes:ex?.new_notes ?? parent.notes,\n    // A cancellation/no-show belongs to the historical source occurrence, not every future repeat.\n    // Recurring exceptions handle later occurrence cancellations individually.\n    status: originalDate===parent.date ? parent.status : 'scheduled'\n"""
          if old not in s:
              raise SystemExit('Expected recurring materialization block not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h = h.replace('V1.33 · shared weekly planner', 'V1.34 · shared weekly planner')
          h = h.replace('manifest.webmanifest?v=1.32', 'manifest.webmanifest?v=1.34')
          h = h.replace('styles.css?v=1.32', 'styles.css?v=1.34')
          h = h.replace('app.js?v=1.33', 'app.js?v=1.34')
          idx.write_text(h)
          PY
          node --check app.js
          grep -q "V1.34 · shared weekly planner" index.html
          grep -q "app.js?v=1.34" index.html
          grep -q "status: originalDate===parent.date ? parent.status : 'scheduled'" app.js
      - name: Commit live fix and clean trigger
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/trigger-recurring-status-fix
          rm -f .github/workflows/fix-recurring-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html .github/workflows/fix-recurring-status.yml .github/trigger-recurring-status-fix
          git commit -m 'Release Scheduler V1.34 recurring status fix'
          git push
